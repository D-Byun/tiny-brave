name: TinyBrave
options:
  bundleIdPrefix: com.tinybrave
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.0.1
targets:
  TinyBrave:
    type: application
    platform: iOS
    sources:
      - path: TinyBrave
        excludes: ["**/*.entitlements", "GoogleService-Info.plist"]
    # GoogleService-Info.plist is private and not in git, so it's copied only when it exists.
    # Without it, Debug builds use local circles and Release builds turn circles off.
    postBuildScripts:
      - name: Copy GoogleService-Info.plist if present
        basedOnDependencyAnalysis: false
        script: |
          PLIST="${SRCROOT}/TinyBrave/GoogleService-Info.plist"
          if [ -f "$PLIST" ]; then
            cp "$PLIST" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/"
          fi
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseAppCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinybrave.app
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Tiny Brave
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Tiny Brave uses the microphone only when you tap start recording, to keep a short recording of your brave moment.
        TARGETED_DEVICE_FAMILY: "1"
      # Entitlements apply to device builds only, so simulator builds and tests don't need a signing team.
      # Release uses the production push and App Attest environments.
      configs:
        Debug:
          "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": TinyBrave/TinyBrave.entitlements
        Release:
          "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": TinyBrave/TinyBraveRelease.entitlements
  TinyBraveTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TinyBraveTests]
    dependencies:
      - target: TinyBrave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinybrave.app.tests
        GENERATE_INFOPLIST_FILE: YES
  TinyBraveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TinyBraveUITests]
    dependencies:
      - target: TinyBrave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinybrave.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TinyBrave
schemes:
  TinyBrave:
    build:
      targets:
        TinyBrave: all
    test:
      targets: [TinyBraveTests, TinyBraveUITests]
