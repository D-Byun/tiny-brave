name: TinyBrave
options:
  bundleIdPrefix: com.tinybrave
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.0.1
targets:
  TinyBrave:
    type: application
    platform: iOS
    sources:
      - path: TinyBrave
        excludes: ["**/*.entitlements"]
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseAppCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinybrave.app
        # Device builds only, so simulator builds and tests don't need a signing team.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": TinyBrave/TinyBrave.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tiny Brave
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Tiny Brave uses the microphone only when you tap start recording, to keep a short recording of your brave moment.
        TARGETED_DEVICE_FAMILY: "1"
  TinyBraveTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TinyBraveTests]
    dependencies:
      - target: TinyBrave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinybrave.app.tests
        GENERATE_INFOPLIST_FILE: YES
  TinyBraveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TinyBraveUITests]
    dependencies:
      - target: TinyBrave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinybrave.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TinyBrave
schemes:
  TinyBrave:
    build:
      targets:
        TinyBrave: all
    test:
      targets: [TinyBraveTests, TinyBraveUITests]
