name: TinyBrave
options:
  bundleIdPrefix: com.tinybrave
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TinyBrave:
    type: application
    platform: iOS
    sources: [TinyBrave]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinybrave.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tiny Brave
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  TinyBraveTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TinyBraveTests]
    dependencies:
      - target: TinyBrave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinybrave.app.tests
        GENERATE_INFOPLIST_FILE: YES
  TinyBraveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TinyBraveUITests]
    dependencies:
      - target: TinyBrave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinybrave.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TinyBrave
schemes:
  TinyBrave:
    build:
      targets:
        TinyBrave: all
    test:
      targets: [TinyBraveTests, TinyBraveUITests]
